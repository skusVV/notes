# Executed by the Cloud Build trigger on every push to the connected GitHub branch.
# No secrets live here - they are read from Secret Manager at deploy/runtime.
steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - ${_FUNCTION_NAME}
      - --gen2
      - --runtime=nodejs20
      - --region=${_REGION}
      - --source=.
      - --entry-point=telegramBot
      - --trigger-http
      - --allow-unauthenticated
      # 256Mi is measured, not guessed: the app boots at ~62 MB RSS with @google/genai loaded,
      # and a five-minute voice note adds only ~2 MB (buffer + base64 + request body).
      - --memory=256Mi
      # Timeout is a ceiling, not a reservation - unlike memory you are not billed for it, so
      # keep headroom for a long memo rather than truncating a transcription mid-flight.
      - --timeout=120s
      - --max-instances=10
      # ENV_VAR=SECRET_NAME:version. Secret Manager names are case-sensitive and must match the
      # secrets in this project exactly. ALLOWED_USERS goes through Secret Manager too, so its
      # comma-separated value cannot collide with the comma that separates entries in this flag.
      # REMINDER_SWEEP_SECRET authenticates the Cloud Scheduler tick that hits POST /sweep. Unset,
      # that endpoint is disabled, so no reminder is ever delivered.
      - --set-secrets=TELEGRAM_BOT_TOKEN=${_TOKEN_SECRET}:latest,TELEGRAM_WEBHOOK_SECRET=${_WEBHOOK_SECRET_NAME}:latest,ALLOWED_USERS=ALLOWED_USERS:latest,REMINDER_SWEEP_SECRET=${_SWEEP_SECRET_NAME}:latest
      # Not secret, so plain env vars. Transcription needs no API key: the function calls Vertex AI
      # as its own runtime service account. It only needs to know which project and endpoint to
      # talk to. Declared here rather than left to code defaults so the model id is visible and
      # changeable at the deploy boundary. No value may contain a comma: this flag splits on them.
      # DEFAULT_TIMEZONE turns "tomorrow at 9" into a real instant, so a wrong value is a wrong
      # reminder time rather than an error. The code default is UTC; the real zone is declared here
      # at the deploy boundary. Kyiv observes DST (UTC+3 summer, UTC+2 winter), which is exactly why
      # recurring reminders must be stored as local wall-clock plus zone, never as a UTC instant.
      # TEST_REFLECT_REPLY and FIRESTORE_DATABASE are driven by substitutions: production keeps the
      # safe defaults (reflection off, default database), the `testing` trigger overrides them.
      # FIRESTORE_DATABASE is declared now so the `test` store is wired before phase 0 reads it; no
      # code reads it yet.
      # REMINDER_SWEEP_INTERVAL_MINUTES is the sweep's look-ahead: each tick delivers everything due
      # before the next one. It must stay equal to the Cloud Scheduler job's frequency (*/30), or
      # reminders arrive late (cron slower) or the same window is swept twice (cron faster).
      - --set-env-vars=GCP_PROJECT=${PROJECT_ID},VERTEX_LOCATION=global,TRANSCRIPTION_MODEL=gemini-3.5-flash-lite,CLASSIFIER_MODEL=gemini-3.5-flash-lite,MAX_VOICE_SECONDS=300,DEFAULT_TIMEZONE=Europe/Kyiv,REMINDER_SWEEP_INTERVAL_MINUTES=30,TEST_REFLECT_REPLY=${_REPLY_REFLECT},FIRESTORE_DATABASE=${_FIRESTORE_DB}

  # Creates or updates the Cloud Scheduler job that ticks POST /sweep every 30 minutes - the
  # schedule is defined here, not clicked together in Console, so it self-heals if ever deleted
  # and matches whichever function (prod or test) this trigger just deployed. Runs after `deploy`
  # (default Cloud Build ordering: steps run in listed order unless waitFor says otherwise) so the
  # function already exists when its URL is looked up. The build's own service account needs
  # roles/cloudscheduler.admin (or broader, e.g. Editor) for this step to succeed.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: schedule-sweep
    entrypoint: bash
    secretEnv: ['SWEEP_SECRET_VALUE']
    args:
      - -c
      - |
        set -euo pipefail
        FUNCTION_URL=$(gcloud functions describe ${_FUNCTION_NAME} --region=${_REGION} --gen2 --format='value(serviceConfig.uri)')
        if gcloud scheduler jobs describe ${_SWEEP_JOB_NAME} --location=${_REGION} >/dev/null 2>&1; then
          gcloud scheduler jobs update http ${_SWEEP_JOB_NAME} \
            --location=${_REGION} \
            --schedule="*/30 * * * *" \
            --time-zone="Europe/Kyiv" \
            --uri="${FUNCTION_URL}/sweep" \
            --update-headers="X-Sweep-Secret=${SWEEP_SECRET_VALUE}"
        else
          gcloud scheduler jobs create http ${_SWEEP_JOB_NAME} \
            --location=${_REGION} \
            --schedule="*/30 * * * *" \
            --time-zone="Europe/Kyiv" \
            --uri="${FUNCTION_URL}/sweep" \
            --http-method=POST \
            --headers="X-Sweep-Secret=${SWEEP_SECRET_VALUE}"
        fi

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/${_SWEEP_SECRET_NAME}/versions/latest
      env: SWEEP_SECRET_VALUE

substitutions:
  _FUNCTION_NAME: telegram-echo-bot
  _REGION: europe-west1
  # Production defaults. The `testing` trigger (branch `testing`) overrides these to deploy an
  # isolated second function from this same file - see docs/specs/README.md:
  #   _FUNCTION_NAME=telegram-echo-bot-test  _TOKEN_SECRET=TELEGRAM_BOT_TOKEN_TEST
  #   _WEBHOOK_SECRET_NAME=TELEGRAM_WEBHOOK_SECRET_TEST  _REPLY_REFLECT=true  _FIRESTORE_DB=test
  #   _SWEEP_SECRET_NAME=REMINDER_SWEEP_SECRET_TEST  _SWEEP_JOB_NAME=reminder-sweep-test
  _TOKEN_SECRET: TELEGRAM_BOT_TOKEN
  _WEBHOOK_SECRET_NAME: TELEGRAM_WEBHOOK_SECRET
  _SWEEP_SECRET_NAME: REMINDER_SWEEP_SECRET
  _SWEEP_JOB_NAME: reminder-sweep
  _REPLY_REFLECT: 'false'
  _FIRESTORE_DB: '(default)'

options:
  logging: CLOUD_LOGGING_ONLY
